name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publication-check:
    name: publication-check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal
      - name: Verify the publishable crate
        run: cargo +1.93.0 package --locked

  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust toolchains
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +1.93.0 fmt --all -- --check
      - name: Test the declared minimum Rust version
        run: cargo +1.88.0 test --all-targets --locked
      - name: Test on the current toolchain
        run: cargo +1.93.0 test --all-targets --locked
      - name: Run Clippy
        run: cargo +1.93.0 clippy --all-targets --locked -- -D warnings
